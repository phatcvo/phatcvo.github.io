# Whole-robot hardware block diagram for article 01. Rendered by the `wiring`
# shortcode: {{< wiring name="hardware_block" >}}
#
# Deliberately coarse. One card per physical assembly, one edge per bus, and
# nothing on a card that the reader does not need to follow the signal path.
# The electrical detail of one branch — PC → MD200T → motors, down to the pin
# names — is drawn separately in data/wiring/motor_control.yaml for article 02.
#
# Edges only ever run between adjacent columns or inside one: the renderer
# draws a direct curve in the wide layout, so a longer span would be routed
# straight across the cards in between.

title: "BEEBOT2 — hardware block diagram"
subtitle: "One pack, one PC, two buses"

columns:
  - id: power
    label: Power
  - id: bay
    label: Distribution & compute
  - id: devices
    label: Sensors & drive
  - id: actuators
    label: Actuators

nodes:
  - id: pack
    column: power
    title: Lithium pack + DALY BMS
    subtitle: 24 V nominal — the only energy source on board

  - id: dist
    column: bay
    title: Distribution + E-stop
    subtitle: fused 24 V rail, drive enable in series
    items:
      - ⬜ no physical E-stop wired yet

  - id: pc
    column: bay
    title: PC — Ubuntu + ROS 2 Jazzy
    subtitle: the whole stack, in Docker

  - id: lidar
    column: devices
    title: LiDAR × 2
    subtitle: 360° roof @ 10 Hz · 180° front @ 15 Hz
    items:
      - ⬜ no driver in the workspace

  - id: imu
    column: devices
    title: IMU — 3DM-GX5-AHRS
    subtitle: rotation rate + acceleration
    items:
      - ⬜ no driver in the workspace

  - id: md200t
    column: devices
    title: MDROBOT MD200T
    subtitle: 2 channels, 12–48 V, 10 A each
    photo: amr/parts/md200t
    photo_alt: The MD200T two-channel BLDC controller

  - id: motors
    column: actuators
    title: 2 × BLDC hub motors
    subtitle: ZLLG65ASM250-L — ⌀0.13 m, 6.5 N·m
    photo: amr/parts/bldc_wheel
    photo_alt: A rubber-tyred BLDC hub motor

edges:
  - { from: pack,   to: dist,   kind: power,   label: "24 V" }
  - { from: pack,   to: pc,     kind: serial,  label: "BMS · USB, 9600 baud" }
  - { from: dist,   to: pc,     kind: power,   label: "regulated DC" }
  - { from: dist,   to: md200t, kind: power,   label: "24 V drive rail" }
  - { from: pc,     to: md200t, kind: rs485,   label: "USB ↔ RS485" }
  - { from: lidar,  to: pc,     kind: serial,  label: "/scan · /scan_front" }
  - { from: imu,    to: pc,     kind: serial,  label: "/imu/data" }
  - { from: md200t, to: motors, kind: phase,   label: "3-phase, 2 channels" }
  - { from: motors, to: md200t, kind: encoder, label: "encoders / hall" }

legend:
  - { kind: power,   label: DC power }
  - { kind: rs485,   label: RS485 — the drive bus }
  - { kind: serial,  label: USB / serial — everything else }
  - { kind: phase,   label: Motor phase (3-ph) }
  - { kind: encoder, label: Encoder / Hall }

note: >-
  **Two buses and one PC.** The drive is alone on RS485; the pack and every
  sensor reach the PC over USB — which is why article 10 spends time on udev
  rules, because a reboot that reorders `ttyUSB0/1/2` silently points the motor
  driver at the battery. Not drawn: the RGBD camera and the bumper are fitted,
  and nothing in the stack reads either of them yet.
