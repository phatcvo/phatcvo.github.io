<head>
  {{ partial "meta" . }}

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  {{ $css := resources.Get "main.css" | css.TailwindCSS }}
  {{ if hugo.IsProduction }}
    {{ with $css | minify | fingerprint }}
      <link
        rel="stylesheet"
        href="{{ .RelPermalink }}"
        integrity="{{ .Data.Integrity }}"
        crossorigin="anonymous"
      />
    {{ end }}
  {{ else }}
    <link href="{{ $css.RelPermalink }}" rel="stylesheet" />
  {{ end }}

  <link rel="stylesheet" href="{{ `/css/general.css` | relURL }}" />
  <link rel="stylesheet" href="{{ `/css/search.css` | relURL }}" />

  <script>
    (function () {
      const html = document.documentElement;
      const stored = window.localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const initial = stored ?? (prefersDark ? "dark" : "light");

      const setTheme = (t) => {
        html.classList.toggle("dark", t === "dark");
        window.localStorage.setItem("theme", t);
      };

      window.toggleTheme = () => {
        setTheme(html.classList.contains("dark") ? "light" : "dark");
      };

      setTheme(initial);
    })();
  </script>

  {{ partial "math.html" . }}
</head>
